<script>
  (function() {
    var nav = document.getElementById('site-nav');
    var burger = document.getElementById('nav-burger');
    var menu = document.getElementById('nav-mobile-menu');
    if (nav) addEventListener('scroll', function() { nav.classList.toggle('scrolled', scrollY > 20); }, { passive: true });

    // Theme toggle — flips + persists site-wide (default dark)
    document.querySelectorAll('[data-theme-toggle]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var root = document.documentElement;
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    });

    // Clean-URL section nav: smooth-scroll without leaving #hash in the address bar
    function cleanUrl() { history.replaceState(null, '', location.pathname + location.search); }
    document.querySelectorAll('a[href^="#"]').forEach(function(a) {
      a.addEventListener('click', function(e) {
        var id = a.getAttribute('href').slice(1);
        var el = id && id !== 'top' ? document.getElementById(id) : null;
        e.preventDefault();
        if (el) { el.scrollIntoView({ behavior: 'smooth' }); }
        else { scrollTo({ top: 0, behavior: 'smooth' }); }
        cleanUrl();
      });
    });
    // Arrived from a case-study link like /index.html#projects — scroll there, then strip the hash
    if (location.hash) {
      var target = document.getElementById(location.hash.slice(1));
      if (target) { requestAnimationFrame(function() { target.scrollIntoView(); cleanUrl(); }); }
      else { cleanUrl(); }
    }

    if (!burger || !menu) return;
    function setOpen(open) {
      burger.classList.toggle('open', open);
      menu.classList.toggle('open', open);
      burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      burger.setAttribute('aria-expanded', String(open));
    }
    burger.addEventListener('click', function() { setOpen(!menu.classList.contains('open')); });
    menu.querySelectorAll('.nav-mobile-link').forEach(function(link) {
      link.addEventListener('click', function() { setOpen(false); });
    });
  })();
</script>
