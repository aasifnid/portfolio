<!-- ══════════════════════════════════════ CHATBOT ══════════════════════════════════════ -->
<button id="chat-bubble" aria-label="Ask about Aasif">
  <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
  <span class="chat-bubble-label">Ask about Aasif</span>
</button>

<div id="chat-panel" role="dialog" aria-label="Chat with Aasif's assistant">
  <div class="chat-header">
    <div class="chat-header-left">
      <div>
        <div class="chat-header-title">AI Assistant <span class="tag">Beta</span></div>
        <div class="chat-header-sub">Powered by Groq</div>
      </div>
    </div>
    <div class="chat-header-actions">
      <button class="chat-reset" id="chat-reset-btn" aria-label="Start new chat" title="New chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button class="chat-close" id="chat-close-btn" aria-label="Close chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="chat-messages" id="chat-messages">
    <div class="chat-msg chat-msg--bot chat-msg--disclaimer">
      <div class="chat-msg-bubble">I'm an AI trained on Aasif's work. I can make mistakes—verify anything important directly with him.</div>
    </div>
  </div>
  <div class="chat-starters" id="chat-starters">
    <button class="chip">What is his design superpower?</button>
    <button class="chip">What does he do outside of work?</button>
    <button class="chip">What has he shipped?</button>
  </div>
  <div class="chat-input-row">
    <input class="chat-input" id="chat-input" type="text" placeholder="Ask a question…" autocomplete="off" />
    <button class="chat-send" id="chat-send">Send</button>
  </div>
</div>

<script>
  (function() {
    var bubble  = document.getElementById('chat-bubble');
    var panel   = document.getElementById('chat-panel');
    var closeBtn= document.getElementById('chat-close-btn');
    var resetBtn= document.getElementById('chat-reset-btn');
    var messages= document.getElementById('chat-messages');
    var starters= document.getElementById('chat-starters');
    var input   = document.getElementById('chat-input');
    var sendBtn = document.getElementById('chat-send');
    var history = [];
    var isOpen  = false;

    /* Snapshot of the initial messages container so reset can restore it cleanly */
    var initialMessagesHTML = messages.innerHTML;

    function openPanel() {
      isOpen = true;
      panel.classList.add('open');
      bubble.style.display = 'none';
      input.focus();
    }

    function closePanel() {
      isOpen = false;
      panel.classList.remove('open');
      bubble.style.display = 'flex';
    }

    function resetChat() {
      history = [];
      messages.innerHTML = initialMessagesHTML;
      starters.style.display = '';
      panel.classList.remove('chat-has-history');
      input.value = '';
      input.focus();
    }

    function markHistoryStarted() {
      panel.classList.add('chat-has-history');
    }

    bubble.addEventListener('click', openPanel);
    closeBtn.addEventListener('click', closePanel);
    resetBtn.addEventListener('click', resetChat);

    var quickAnswers = {
      "What has he shipped?": "4 case studies: Feel Check (emotional check-in, 2/3 tutors saw better readiness), New Trial (50% conversion lift), Tutoring Home Redesign (unified structure for 30K students), Cuemath Partners (transparent referral). Designed for ~30K active students at Cuemath.",
      "What is his design superpower?": "Systems thinking—spotting how pieces fit together and second-order effects others miss. Combines deep user empathy with intentionality to solve real problems at scale.",
      "What does he do outside of work?": "Reads about tech & world. Foodie who loves cooking. Values genuine relationships—believes that's how best things happen."
    };

    starters.querySelectorAll('.chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        var question = chip.textContent;
        var answer = quickAnswers[question];
        if (answer) {
          starters.style.display = 'none';
          markHistoryStarted();
          addMsg('user', question);
          history.push({ role: 'user', content: question });
          var reply = addMsg('bot', answer);
          history.push({ role: 'model', content: answer });
        } else {
          sendMessage(question);
        }
      });
    });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(input.value); }
    });
    sendBtn.addEventListener('click', function() { sendMessage(input.value); });

    function renderMarkdown(text) {
      // Convert **bold** to <strong>bold</strong>
      text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      // Convert * bullets to •
      text = text.replace(/^\* /gm, '• ');
      // Convert newlines to <br>
      text = text.replace(/\n/g, '<br>');
      return text;
    }

    function addMsg(role, text, isTyping) {
      var div = document.createElement('div');
      div.className = 'chat-msg chat-msg--' + role;
      var bubble = document.createElement('div');
      bubble.className = 'chat-msg-bubble' + (isTyping ? ' typing' : '');
      if (isTyping) {
        bubble.textContent = text;
      } else {
        bubble.innerHTML = renderMarkdown(text);
      }
      div.appendChild(bubble);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    function sendMessage(text) {
      text = (text || '').trim();
      if (!text) return;

      starters.style.display = 'none';
      markHistoryStarted();
      input.value = '';
      sendBtn.disabled = true;

      addMsg('user', text);
      history.push({ role: 'user', content: text });

      var typingBubble = addMsg('bot', 'Thinking…', true);

      fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history.slice(0, -1) })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) {
          console.error('Chat API error:', data.error, data.message);
          // Show specific message for rate limit
          if (data.error === 'rate_limit') {
            typingBubble.textContent = data.message || 'I\'ve hit my token limit. I apologize. Please come back in a few minutes.';
          } else {
            typingBubble.textContent = 'Sorry, something went wrong. Try again.';
          }
        } else {
          var reply = data.reply || 'Sorry, something went wrong. Try again.';
          typingBubble.innerHTML = renderMarkdown(reply);
          history.push({ role: 'model', content: reply });
        }
        typingBubble.classList.remove('typing');
        messages.scrollTop = messages.scrollHeight;
      })
      .catch(function(err) {
        console.error('Chat fetch error:', err);
        typingBubble.textContent = 'Something went wrong. Please try again.';
        typingBubble.classList.remove('typing');
      })
      .finally(function() {
        sendBtn.disabled = false;
        input.focus();
      });
    }
  })();
</script>
